services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: namma
      POSTGRES_PASSWORD: namma_local
      POSTGRES_DB: namma_dina
    ports:
      - "5432:5432"
    volumes:
      - namma_dina_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U namma -d namma_dina"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  namma_dina_pg:
