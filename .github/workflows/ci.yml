name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Typecheck, Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nammadina
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma migrations
        run: npm run db:deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/nammadina?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run test suite
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/nammadina?schema=public
          JWT_SECRET: test_jwt_secret_must_be_at_least_32_characters_long_for_security
          SESSION_SECRET: test_session_secret_must_be_at_least_32_characters_long
          NODE_ENV: test

      - name: Build client & server
        run: npm run build

